# Compose is a YAML file that describes how to run containers.
# v1: only the API. v2: you will add a database service under `services:`.

services:
  api:
    build: .
    container_name: docker-learning-api
    ports:
      # host:container — left side is the public VPS port.
      # 3000 and 3001 are already used on this Contabo box.
      - "3010:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    # If the VPS reboots or the process crashes, start the container again.
    restart: unless-stopped

